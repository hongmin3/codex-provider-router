name: test

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test Python router and zsh scripts
        run: |
          zsh -n scripts/*.sh
          python3 -m unittest discover -s tests

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          foreach ($File in Get-ChildItem scripts\*.ps1) {
            $Tokens = $null
            $Errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $File.FullName,
              [ref]$Tokens,
              [ref]$Errors
            )
            if ($Errors.Count -gt 0) {
              $Errors | ForEach-Object { Write-Error "$($File.Name): $_" }
              exit 1
            }
          }
      - name: Test Windows wrapper contract
        run: python -m unittest discover -s tests -p test_windows_scripts.py
